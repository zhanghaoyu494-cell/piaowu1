[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-ai-memory"
version = "0.2.0"
description = "Local-first, source-grounded memory for AI assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "mcp>=1.10,<2",
]

[project.scripts]
lam = "local_ai_memory.cli:main"
lam-mcp = "local_ai_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_memory"]
